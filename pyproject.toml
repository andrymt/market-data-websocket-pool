[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-websocket-pool"
version = "0.1.0"
description = "Resilient public trade-feed ingestion from Coinbase, Kraken, and Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Andrii Trush"}]
dependencies = ["websockets==15.0.1"]

[project.optional-dependencies]
dev = ["ruff==0.14.2", "build==1.3.0"]

[project.scripts]
market-pool = "market_pool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]
